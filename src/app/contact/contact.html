<section class="contact-page">
  <div class="contact-container">

    <div class="contact-info">
      <span>CONTACT US</span>
      <h1>Let's Work Together</h1>

      <p>
        Have a project in mind or need help with your digital presence?
        Send us a message and let's discuss how we can help.
      </p>

      <div class="contact-item">
        <div class="contact-icon">✉</div>
        <div>
          <small>Email</small>
          <h3>hello@example.com</h3>
        </div>
      </div>

      <div class="contact-item">
        <div class="contact-icon">☎</div>
        <div>
          <small>Phone</small>
          <h3>+92 300 0000000</h3>
        </div>
      </div>

      <div class="contact-item">
        <div class="contact-icon">⌖</div>
        <div>
          <small>Location</small>
          <h3>Pakistan</h3>
        </div>
      </div>
    </div>

    <form class="contact-form">
      <div class="input-row">
        <div class="input-group">
          <label>Your Name</label>
          <input type="text" placeholder="Enter your name">
        </div>

        <div class="input-group">
          <label>Email Address</label>
          <input type="email" placeholder="Enter your email">
        </div>
      </div>

      <div class="input-group">
        <label>Subject</label>
        <input type="text" placeholder="What is this about?">
      </div>

      <div class="input-group">
        <label>Message</label>
        <textarea rows="6" placeholder="Write your message..."></textarea>
      </div>

      <button type="submit">Send Message →</button>
    </form>

  </div>
</section>
